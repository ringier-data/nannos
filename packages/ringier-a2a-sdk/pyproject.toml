[project]
name = "ringier-a2a-sdk"
version = "1.7.2"
description = "Ringier A2A SDK for building authenticated agent-to-agent communication systems"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyjwt>=2.10.1",
    "aiohttp>=3.11.0",
    "httpx>=0.28.1",
    "starlette>=0.46.2",
    "a2a-sdk>=1.1.0,<2.0.0",
    "cryptography>=43.0.0",
    "authlib>=1.6.5",
    "sqlalchemy>=2.0.51",
    # OTel API only (never the SDK): a library records against whatever provider
    # the host installs. In the cluster that is the injected auto-instrumentation
    # agent; with no provider the API is a no-op.
    "opentelemetry-api>=1.27.0",
]

[project.optional-dependencies]
langgraph = [
    "langchain>=1.4.5",
    "langchain-aws>=1.4.3",
    "langgraph>=1.1.0",
    "langgraph-checkpoint-aws>=0.1.4",
    "langchain-mcp-adapters>=0.0.6",
    "deepagents[quickjs]>=0.7.25,<0.8.0",
    "langchain-quickjs>=0.3.8,<0.4",  # wasm line; pre-wasm engine could SIGABRT the pod. >=0.3.7 keys REPLs by `_quickjs_slot_id`
    "boto3>=1.35.0",
    "langgraph-checkpoint-postgres>=3.1.0",
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.1.0",
]
langgraph-google = [
    "langchain>=1.4.5",
    "langchain-google-genai>=0.1.0",
    "langgraph>=1.1.0",
    "langgraph-checkpoint-aws>=0.1.4",
    "langchain-mcp-adapters>=0.0.6",
    "deepagents[quickjs]>=0.7.25,<0.8.0",
    "langchain-quickjs>=0.3.8,<0.4",  # wasm line; pre-wasm engine could SIGABRT the pod. >=0.3.7 keys REPLs by `_quickjs_slot_id`
    "boto3>=1.35.0",
]
google-embeddings = [
    "langchain-core>=0.3.0",
    "google-genai>=1.0.0",
    "google-auth>=2.25.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    # In-memory span exporter, to assert on recorded spans.
    "opentelemetry-sdk>=1.27.0",
    # Include langgraph dependencies for comprehensive testing
    "langchain>=1.4.5",
    "langchain-aws>=1.4.3",
    "langgraph>=1.1.0",
    "langgraph-checkpoint-aws>=0.1.4",
    "langchain-mcp-adapters>=0.0.6",
    "deepagents[quickjs]>=0.7.25,<0.8.0",
    "langchain-quickjs>=0.3.8,<0.4",  # wasm line; pre-wasm engine could SIGABRT the pod. >=0.3.7 keys REPLs by `_quickjs_slot_id`
    "boto3>=1.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
