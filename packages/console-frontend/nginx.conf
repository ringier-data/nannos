server {
    listen 8081;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — serve index.html for all client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (vite hashes filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The console's own Nannos agent definition (ADR-0006), emitted by
    # vite-plugins/agentSkills.ts into dist/.well-known/agent-skills/. console-backend
    # fetches it digest-pinned, so: static files only, a missing file is a real 404
    # (never the SPA's index.html), and a modest max-age (the consumer clamps it to
    # [60 s, 3600 s]). `^~` keeps any future regex location from taking these paths.
    location ^~ /.well-known/agent-skills/ {
        try_files $uri =404;
        # Replaces the http-level map for this location, so json must be restated.
        types {
            application/json json;
            text/markdown md;
        }
        default_type application/octet-stream;
        charset utf-8;
        charset_types application/json text/markdown;
        # A location with its own add_header inherits none from the server level,
        # so the security headers are repeated here.
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /health {
        access_log off;
        return 200 'OK';
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
}
